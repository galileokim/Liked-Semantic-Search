[project]
name = "likes-search"
version = "0.1.0"
description = "Semantic search over your YouTube liked videos (transcripts + metadata)."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "chromadb>=1.0",
    "sentence-transformers>=3.0",
    "youtube-transcript-api>=1.0",
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.11", "ruff>=0.6"]

[project.scripts]
likes = "likes_search.adapters.inbound.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/likes_search"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "googleapiclient.*",
    "google_auth_oauthlib.*",
    "google.oauth2.*",
    "google.auth.*",
    "youtube_transcript_api.*",
    "sentence_transformers.*",
]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/likes_search/adapters/inbound/api.py" = ["E501"]  # inline HTML

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["likes_search.domain.chunking.ChunkingConfig"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
